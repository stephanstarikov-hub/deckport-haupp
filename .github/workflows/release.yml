name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native Desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Check native Desktop client
        run: |
          cargo fmt --manifest-path desktop-native/Cargo.toml -- --check
          cargo clippy --manifest-path desktop-native/Cargo.toml --locked -- -D warnings
      - name: Build native Desktop client
        run: |
          cargo build --manifest-path desktop-native/Cargo.toml --release --locked
          cp desktop-native/target/release/deckport-vpn-desktop desktop/deckport
          python scripts/rust_licenses.py
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c 'import os,json; assert os.environ["RELEASE_TAG"] == "v" + json.load(open("package.json"))["version"]'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/fetch_deps.py
      - run: pnpm typecheck && pnpm build
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
      - run: python scripts/check_core.py
      - run: sudo unshare --net --mount --mount-proc python3 -u scripts/linux_smoke.py
      - run: python scripts/package.py
      - name: Publish binaries, checksums and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          title="DeckPort VPN $RELEASE_TAG"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
            title="$title - preview"
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag "${flags[@]}" --title "$title" --notes-file .github/RELEASE_NOTES.md
